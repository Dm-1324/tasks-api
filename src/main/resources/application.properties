spring.application.name=tasks-api

# Values come from App Service app settings (environment variables)
app.version=${APP_VERSION:1.0.0}
storage.account-name=${STORAGE_ACCOUNT_NAME:changeme}
storage.container=tasks

# API_KEY is a Key Vault reference on App Service - App Service puts the secret value here
app.api-key=${API_KEY:}

# /actuator/health - used by the App Service health check
management.endpoints.web.exposure.include=health
